{% extends "base.html" %}
{% block contenido %}

{% set titulo = "Analizador de Recetas" %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg">
            <div class="card-body">

                <h3 class="text-center text-success mb-4">{{ titulo }}</h3>

                <form method="POST">
                    <div class="mb-3">
                        <label>Ingredientes (nombre:calorías separados por comas)</label>
                        <textarea name="ingredientes" class="form-control" rows="4" placeholder="Ej: arroz:130, pollo:200" required></textarea>
                    </div>
                    <button class="btn btn-success w-100">Analizar</button>
                </form>

                {% if resultado %}
                <div class="mt-4 p-3 rounded bg-info text-white text-center">
                    <h4>Calorías totales de la receta: <strong>{{ resultado }} kcal</strong></h4>
                    <h5>{{ mensaje }}</h5>
                </div>
                {% endif %}

            </div>
        </div>
    </div>
</div>

{% endblock %}
